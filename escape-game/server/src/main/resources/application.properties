server.port=8080

# --- IoT -------------------------------------------------------------------
# Adresse du broker Mosquitto (le Raspberry Pi). À adapter au réseau :
#   mvn -pl server spring-boot:run -Dspring-boot.run.arguments=--escape.mqtt.url=tcp://10.220.64.83:1883
escape.mqtt.url=tcp://localhost:1883

# --- Jeu -------------------------------------------------------------------
# Code qui coupe le courant (21-35-33-22-33 dans la grille du témoignage).
escape.power-code=ALIBI

# Durée d'une partie, en secondes (30 min). Pour tester : --escape.duree-partie=300
escape.duree-partie=1800
# Secondes retirées au chrono, en plus du temps normal, pour chaque seconde où le faisceau est coupé.
escape.penalite-laser=5

# --- Base de données locale (fichier ./data/escape.mv.db) --------------------
spring.datasource.url=jdbc:h2:file:./data/escape
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Renvoie le message des erreurs au client (ex. « La clé USB n'est pas branchée. »)
server.error.include-message=always
